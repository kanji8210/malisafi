<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#grad)"/>
  
  <g transform="translate(400, 300)">
    <!-- House icon -->
    <path d="M -100 -50 L 0 -150 L 100 -50 L 100 100 L -100 100 Z" 
          fill="rgba(255,255,255,0.3)" 
          stroke="white" 
          stroke-width="4"/>
    
    <!-- Door -->
    <rect x="-30" y="20" width="60" height="80" 
          fill="rgba(255,255,255,0.5)" 
          stroke="white" 
          stroke-width="3"/>
    
    <!-- Window left -->
    <rect x="-70" y="-20" width="30" height="30" 
          fill="rgba(255,255,255,0.5)" 
          stroke="white" 
          stroke-width="3"/>
    
    <!-- Window right -->
    <rect x="40" y="-20" width="30" height="30" 
          fill="rgba(255,255,255,0.5)" 
          stroke="white" 
          stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="480" 
        font-family="Arial, sans-serif" 
        font-size="32" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle">
    No Image Available
  </text>
  
  <text x="400" y="520" 
        font-family="Arial, sans-serif" 
        font-size="20" 
        fill="rgba(255,255,255,0.8)" 
        text-anchor="middle">
    MalisafiMLS Property
  </text>
</svg>
